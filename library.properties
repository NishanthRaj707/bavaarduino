name=BAVA Protocol
version=2.0.0
author=Nishanth Raj
maintainer=Nishanth Raj
sentence=Reliable variable sync between two microcontrollers over serial, with CRC-16 and no dynamic memory.
paragraph=Register a variable under an ID and write or read it on the other board. Binary frames use a sync preamble, length field, byte-stuffing and CRC-16 checked before memory is updated, so partial or corrupted serial data is rejected instead of parsed. Non-blocking state machine, zero heap, fixed stack. Works on any board with a serial port; examples for Arduino, ESP32 and STM32. GPL-3.0, commercial licence available.
category=Communication
url=https://github.com/NishanthRaj707/bavaprotocol
architectures=*